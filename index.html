<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#0f1a2e;--floor:#21304b;--line:#3a4d70;--text:#e8edf6;--mute:#93a1bb;--work:#4cc9c0;--wait:#f2b84b;--idle:#9db4ff;--off:#5b6477;--wood:#9a6b43;font-family:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}
header{display:flex;gap:16px;align-items:baseline;padding:16px 20px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:800}
.mode{font-size:13px;padding:3px 10px;border-radius:99px;background:#33405c;color:var(--wait)}
.mode.live{color:var(--work)}
main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;padding:0 20px 24px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.office{position:relative;aspect-ratio:16/10;background:var(--floor);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.zone{position:absolute;border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--mute);padding:6px 10px}
.desk{position:absolute;width:15%;height:9%;background:var(--wood);border-radius:6px;transform:translate(-50%,-50%)}
.desk:before{content:"";position:absolute;left:30%;top:-45%;width:40%;height:55%;background:#14213a;border:2px solid #6b7fa8;border-radius:4px}
.av{position:absolute;transform:translate(-50%,-50%);transition:left 1.6s ease,top 1.6s ease;text-align:center;width:90px;z-index:2}
.head{width:22px;height:22px;border-radius:50%;margin:0 auto}
.body{width:30px;height:16px;border-radius:10px 10px 4px 4px;margin:1px auto 3px}
.tag{font-size:11px;font-weight:600;background:#0c1424cc;border-radius:99px;padding:2px 7px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.av[data-s=working] .tag i{background:var(--work)}.av[data-s=waiting] .tag i{background:var(--wait)}
.av[data-s=stuck] .tag i{background:#ef6461}.av[data-s=offline]{opacity:.45;filter:grayscale(1)}.av[data-s=offline] .tag i{background:var(--off)}
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;width:130px;background:#fff;color:#14213a;font-size:11px;line-height:1.3;border-radius:8px;padding:5px 7px}
.bub[hidden]{display:none}
aside{display:flex;flex-direction:column;gap:14px}
.panel{background:#16233b;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h2{margin:0 0 8px;font-size:15px}
.task{padding:8px 0;border-top:1px solid #26365494;font-size:13px}.task:first-of-type{border-top:0}
.meta{color:var(--mute);font-size:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{height:5px;background:#26365a;border-radius:9px;margin-top:5px;overflow:hidden}.bar b{display:block;height:100%;background:var(--work)}
button,select,input{font:inherit;color:inherit}
button{background:var(--work);color:#08202a;border:0;border-radius:7px;padding:4px 10px;font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--wait);outline-offset:2px}
form{display:flex;gap:6px;flex-wrap:wrap}
input,select{background:#0f1a2e;border:1px solid var(--line);border-radius:7px;padding:7px 9px}input{flex:1;min-width:140px}
a{color:var(--work)}
@media(prefers-reduced-motion:reduce){.av{transition:none}}
</style>
</head>
<body>
<header><h1>Kantor AI</h1><span id="mode" class="mode"></span><span id="sum" style="color:var(--mute);font-size:14px"></span></header>
<main>
 <div id="office" class="office">
  <div class="zone" style="left:2%;top:3%;width:32%;height:44%">Pantry · istirahat</div>
  <div class="zone" style="left:37%;top:3%;width:28%;height:44%">Ruang Owner · menunggu keputusanmu</div>
  <div class="zone" style="left:68%;top:3%;width:30%;height:44%">Ruang Supervisor</div>
  <div class="zone" style="left:2%;top:52%;width:64%;height:45%">Ruang Kerja</div>
  <div class="zone" style="left:69%;top:52%;width:29%;height:45%">Offline · tidak ada heartbeat</div>
  <div class="desk" style="left:26%;top:76%"></div><div class="desk" style="left:50%;top:76%"></div><div class="desk" style="left:82%;top:30%"></div>
 </div>
 <aside>
  <div class="panel"><h2>Beri perintah</h2>
   <form id="f"><select id="who" aria-label="Agen"></select><input id="q" placeholder="mis. Buat poster promo diskon 50%" aria-label="Perintah"><button>Kirim tugas</button></form></div>
  <div class="panel"><h2>Tugas</h2><div id="list"></div></div>
 </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Isi dua nilai ini dengan data proyek Supabase-mu (pakai anon key, bukan service key).
const CFG={url:"https://aqqtcclerjrfvdueisbi.supabase.co",key:"sb_publishable_lyyIFPQ-Y2pQNF-Y4-OcMQ_4yRfFF48"};
const demo=!CFG.url,$=id=>document.getElementById(id),now=()=>Date.now();
const COLOR={bima:"#f28482",rina:"#cdb4ff",dito:"#ffd166"};
const DESK={rina:[26,72],dito:[50,72],bima:[82,27]};
const SLOT={idle:[[10,24],[20,36],[12,40]],waiting:[[50,26],[44,38],[56,38]],offline:[[80,72],[90,80],[78,86]]};
const LABEL={queued:"Antre",running:"Dikerjakan",needs_approval:"Menunggu persetujuanmu",done:"Selesai",failed:"Gagal"};
let agents=[],tasks=[],sb;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{const s=Math.max(0,(now()-new Date(t))/1000|0);return s<60?s+" dtk lalu":s<3600?(s/60|0)+" mnt lalu":(s/3600|0)+" jam lalu"};
// Status dihitung dari data nyata: heartbeat + tugas. Tidak ada status yang diketik manual.
function st(a){
 if(now()-new Date(a.last_heartbeat)>90000)return"offline";
 const t=tasks.filter(x=>x.agent_id===a.id),u=x=>now()-new Date(x.updated_at||x.created_at);
 if(t.some(x=>x.status==="needs_approval"))return"waiting";
 if(t.some(x=>x.status==="running"&&u(x)>120000))return"stuck"; // tidak ada pembaruan > 2 menit
 if(t.some(x=>x.status==="running"))return"working";
 if(t.some(x=>(x.status==="done"||x.status==="failed")&&u(x)<60000))return"wrap"; // tetap di meja 60 dtk sebelum ke pantry
 return"idle";
}
function render(){
 const office=$("office");let w=0;
 agents.forEach((a,i)=>{
  const s=st(a);if(s==="working")w++;
  let el=$("av-"+a.id);
  if(!el){el=document.createElement("div");el.id="av-"+a.id;el.className="av";
   el.innerHTML='<div class="bub" hidden></div><div class="head"></div><div class="body"></div><div class="tag"><i></i><b></b></div>';
   el.querySelector(".head").style.background=el.querySelector(".body").style.background=COLOR[a.id]||"#ccc";office.appendChild(el);}
  const p=(s==="working"||s==="stuck"||s==="wrap"||(s==="idle"&&a.id==="bima"))?DESK[a.id]:SLOT[s][i%3];
  el.style.left=p[0]+"%";el.style.top=p[1]+"%";el.dataset.s=s;
  el.querySelector("b").textContent=a.name+" · "+a.role;
  const b=el.querySelector(".bub");b.textContent=a.last_log||"";b.hidden=!(a.last_log&&(s==="working"||s==="waiting"||s==="stuck"));
 });
 $("sum").textContent=w+" bekerja · "+tasks.filter(t=>t.status==="queued").length+" antre · "+agents.filter(a=>st(a)==="offline").length+" offline";
 $("list").innerHTML=tasks.length?tasks.map(t=>{const a=agents.find(x=>x.id===t.agent_id),off=a&&st(a)==="offline"&&t.status==="queued",stuck=t.status==="running"&&now()-new Date(t.updated_at||t.created_at)>120000;
  return`<div class="task"><b>${esc(t.title)}</b><div class="meta"><span>${esc(a?.name)} · ${off?"Agen offline":stuck?"Macet, tidak ada pembaruan":LABEL[t.status]||t.status} · ${ago(t.updated_at||t.created_at)}</span>
  ${stuck?`<button data-rq="${esc(t.id)}">Antre ulang</button>`:""}${t.status==="needs_approval"?`<span>${t.result_url?`<a href="${esc(t.result_url)}" target="_blank" rel="noopener">Unduh JPG</a> `:""}<button data-ok="${esc(t.id)}">Setujui</button></span>`:t.status==="done"&&t.result_url?`<a href="${esc(t.result_url)}" target="_blank" rel="noopener">Unduh JPG</a>`:""}</div>
  <div class="bar"><b style="width:${t.progress||0}%"></b></div></div>`}).join(""):'<div class="meta">Belum ada tugas. Kirim perintah pertamamu.</div>';
}
$("list").onclick=async e=>{const rq=e.target.dataset.rq;
 if(rq){if(demo){const t=tasks.find(x=>x.id===rq);t.status="queued";t.updated_at=new Date().toISOString();}
  else{await sb.from("tasks").update({status:"queued",progress:0,updated_at:new Date().toISOString()}).eq("id",rq);load();}return render();}
 const id=e.target.dataset.ok;if(!id)return;
 if(demo){const t=tasks.find(x=>x.id===id);t.status="done";t.updated_at=new Date().toISOString();render();}
 else{await sb.from("tasks").update({status:"done"}).eq("id",id);load();}};
$("f").onsubmit=async e=>{e.preventDefault();const title=$("q").value.trim();if(!title)return;
 const row={agent_id:$("who").value,title,status:"queued",progress:0};$("q").value="";
 if(demo)tasks.unshift({...row,id:crypto.randomUUID(),created_at:new Date().toISOString()});else await sb.from("tasks").insert(row);
 render();};
async function load(){
 const[a,t]=await Promise.all([sb.from("agents").select("*").order("id"),sb.from("tasks").select("*").order("created_at",{ascending:false}).limit(20)]);
 agents=a.data||[];tasks=t.data||[];fillWho();render();}
function fillWho(){if($("who").options.length!==agents.length)$("who").innerHTML=agents.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} (${esc(a.role)})</option>`).join("");}
if(demo){
 $("mode").textContent="MODE DEMO · data simulasi, bukan agen nyata";
 const iso=ms=>new Date(now()-ms).toISOString();
 agents=[{id:"bima",name:"Bima",role:"Supervisor",last_heartbeat:iso(0)},{id:"rina",name:"Rina",role:"Desain Grafis",last_heartbeat:iso(0)},{id:"dito",name:"Dito",role:"Editor Video",last_heartbeat:iso(300000)}];
 tasks=[{id:"d1",agent_id:"rina",title:"Poster promo diskon akhir tahun",status:"running",progress:35,created_at:iso(120000)}];
 fillWho();render();
 setInterval(()=>{agents.forEach(a=>{if(a.id!=="dito")a.last_heartbeat=iso(0);
  const mine=tasks.filter(t=>t.agent_id===a.id&&now()-new Date(a.last_heartbeat)<90000),run=mine.find(t=>t.status==="running");
  if(run){run.progress=Math.min(100,run.progress+8);run.updated_at=iso(0);a.last_log=run.progress<50?"Menyusun layout dari template":"Merender JPG resolusi tinggi";
   if(run.progress>=100){run.status="needs_approval";run.result_url="#";a.last_log="Selesai! Cek hasilnya ya";}}
  else{const q=mine.reverse().find(t=>t.status==="queued");if(q){q.status="running";q.updated_at=iso(0);a.last_log="Mulai: "+q.title;}}});render();},2500);
}else{
 $("mode").textContent="LIVE · terhubung ke Supabase";$("mode").classList.add("live");
 sb=supabase.createClient(CFG.url,CFG.key);load();
 sb.channel("office").on("postgres_changes",{event:"*",schema:"public"},load).subscribe();
 setInterval(load,15000); // cadangan bila koneksi realtime putus
}
setInterval(render,5000); // cek ulang heartbeat basi tanpa menunggu data baru
</script>
</body>
</html>
